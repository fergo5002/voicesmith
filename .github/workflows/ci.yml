name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts
      - name: Unit tests
        run: uv run --no-sync pytest -q -m "not slow"

  models:
    name: real-model tests (ubuntu)
    runs-on: ubuntu-latest
    env:
      VOICESMITH_MODELS: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .models
          key: voicesmith-models-${{ hashFiles('src/voicesmith/models.py') }}
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Fetch and verify models
        run: uv run --no-sync python -c "from voicesmith import models; [models.ensure(k) for k in models.MODELS]; print(models.status())"
      - name: Model tests
        run: uv run --no-sync pytest -q -m slow
