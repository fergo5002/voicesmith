# Publishes to PyPI when a GitHub release is published, using PyPI trusted
# publishing (no stored token). Inert until the project is registered on PyPI
# with this repository and workflow as a trusted publisher.
name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish --trusted-publishing always
